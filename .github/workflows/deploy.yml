# Builds the site and publishes it to GitHub Pages on every push to main.
# Nothing to install: build.py is plain Python 3 with no dependencies.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        # Defaults are right for a GitHub Pages *project* page served at
        # https://<owner>.github.io/<repo>/.
        # When the custom domain is live, set these as repository variables
        # (Settings -> Secrets and variables -> Actions -> Variables):
        #     SITE_ORIGIN   = https://liminex.net
        #     BASE_PATH     = /            (a bare slash means "site root")
        #     CUSTOM_DOMAIN = liminex.net  (writes the CNAME file)
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
