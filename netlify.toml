# Netlify builds the site from the GitHub repo on every push to main.
[build]
  command = "python3 build.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.11"
  # Pages the team still has to review: built, reachable by URL, but unlinked and
  # noindex. Set to "" to publish everything.
  HIDDEN_PAGES = "price,about"
